interface:
  display_name: "项目开发守护"
  short_description: "先问清需求并选择最优方案，再安全管理开发与合并"
  default_prompt: "Use $manage-project-development to clarify this request, persist one reviewed design contract, choose the best-fit solution, and manage implementation through the compact project map until merge confirmation."

dependencies:
  tools:
    - type: "mcp"
      value: "project-guardian"
      description: "Persistent requirement discovery, design contracts, adaptive risk/model stages, code graph, Codex task/worktree bindings, scope conflicts, evidence, and merge-readiness tools"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
